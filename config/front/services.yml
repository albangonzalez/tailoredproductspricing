services:
    _defaults:
        autowire: true
        autoconfigure: false
        public: true

    PrestaShop\Module\TailoredProducts\Adapter\ColorAttributeProvider:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    PrestaShop\Module\TailoredProducts\Service\DimensionsFieldsProvider: ~
        # autowires ProductConfigRepository by type

    PrestaShop\Module\TailoredProducts\Service\AddToCartCustomizer: ~
        # autowires ProductConfigRepository / TpProductCustomizationFieldRepository by type

    PrestaShop\Module\TailoredProducts\Service\ProductChoicesProvider: ~
        # autowires ProductConfigRepository by type

    PrestaShop\Module\TailoredProducts\Repository\ProductConfigRepository:
        class: PrestaShop\Module\TailoredProducts\Repository\ProductConfigRepository
        factory: ['@doctrine.orm.default_entity_manager', 'getRepository']
        arguments:
            - PrestaShop\Module\TailoredProducts\Entity\TpProductConfig

    PrestaShop\Module\TailoredProducts\Repository\CombinationConfigRepository:
        class: PrestaShop\Module\TailoredProducts\Repository\CombinationConfigRepository
        factory: ['@doctrine.orm.default_entity_manager', 'getRepository']
        arguments:
            - PrestaShop\Module\TailoredProducts\Entity\TpCombinationConfig

    PrestaShop\Module\TailoredProducts\Repository\TpProductCustomizationFieldRepository:
        class: PrestaShop\Module\TailoredProducts\Repository\TpProductCustomizationFieldRepository
        factory: ['@doctrine.orm.default_entity_manager', 'getRepository']
        arguments:
            - PrestaShop\Module\TailoredProducts\Entity\TpProductCustomizationField

    PrestaShop\Module\TailoredProducts\Service\PriceWriter:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    PrestaShop\Module\TailoredProducts\Service\PriceCalculator: ~
