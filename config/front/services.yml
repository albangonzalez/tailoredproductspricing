services:
    _defaults:
        autowire: true
        autoconfigure: false
        public: true

    PrestaShop\Module\TailoredProducts\Adapter\ColorAttributeProvider:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    PrestaShop\Module\TailoredProducts\Service\DimensionsFieldsProvider: ~
        # autowires TailoredProductSettingsRepository by type

    PrestaShop\Module\TailoredProducts\Service\AddToCartCustomizer: ~
        # autowires TailoredProductSettingsRepository / TailoredProductCustomizationFieldRepository by type

    PrestaShop\Module\TailoredProducts\Service\ProductChoicesProvider: ~
        # autowires TailoredProductSettingsRepository by type

    PrestaShop\Module\TailoredProducts\Repository\TailoredProductSettingsRepository:
        class: PrestaShop\Module\TailoredProducts\Repository\TailoredProductSettingsRepository
        factory: ['@doctrine.orm.default_entity_manager', 'getRepository']
        arguments:
            - PrestaShop\Module\TailoredProducts\Entity\TailoredProductSettings

    PrestaShop\Module\TailoredProducts\Repository\TailoredProductAttributeRepository:
        class: PrestaShop\Module\TailoredProducts\Repository\TailoredProductAttributeRepository
        factory: ['@doctrine.orm.default_entity_manager', 'getRepository']
        arguments:
            - PrestaShop\Module\TailoredProducts\Entity\TailoredProductAttribute

    PrestaShop\Module\TailoredProducts\Repository\TailoredProductCustomizationFieldRepository:
        class: PrestaShop\Module\TailoredProducts\Repository\TailoredProductCustomizationFieldRepository
        factory: ['@doctrine.orm.default_entity_manager', 'getRepository']
        arguments:
            - PrestaShop\Module\TailoredProducts\Entity\TailoredProductCustomizationField

    PrestaShop\Module\TailoredProducts\Service\PriceWriter:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    PrestaShop\Module\TailoredProducts\Service\PriceCalculator: ~
